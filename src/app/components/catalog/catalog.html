<div style="display: flex; align-items: center; justify-content: space-between; width: 40%">
  <h2>Catalogo</h2>
  <button (click)="catalogService.updateProducts()">Aggiungi prodotto</button>
</div>
<p>Prodotti disponibili: {{ catalogService.prodottiTotali() }}</p>

@for (p of catalogService.prodotti(); track p.id) {

}
